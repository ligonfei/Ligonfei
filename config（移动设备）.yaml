# ------------------------------------------------------------------------------
# 12. 路由分流规则 (Routing Rules)
# ------------------------------------------------------------------------------
# 规则匹配原则:
#   自顶向下逐行匹配，一旦命中立即应用出口策略，不再向下匹配。
#
# no-resolve 参数机制说明:
#   对于 IP-CIDR / GEOIP 类规则，加上 no-resolve 表示:
#   如果当前数据包仅持有域名 (如 Fake-IP 模式下)，内核绝不为了匹配该 IP 规则而触发对域名的真实 DNS 解析！
#   这样能彻底避免不必要的远端/本地 DNS 泄露，极大提高匹配性能。
rules:
  # 1. 私有网络与局域网直连 (最高优先级放行)
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # 2. NTP 网络时间授时协议端口直连 (UDP 123 绝不能走代理)
  - DST-PORT,123,DIRECT

  # 3. 自定义域名专属出口
  - DOMAIN-SUFFIX,ligon.top,Imm

  # 4. 广告拦截与网络测速
  - RULE-SET,adblock_domain,广告拦截
  - RULE-SET,speedtest_domain,Speedtest
# 5. 高安全性业务 (密码管理器与加密货币交易所)
  - RULE-SET,password_manager_domain,密码管理器
  - RULE-SET,binance_domain,交易所
  - RULE-SET,OKX_domain,交易所
  - RULE-SET,bybit_domain,交易所
  - RULE-SET,gate_domain,交易所

  # 6. 人工智能服务 (OpenAI / Claude / Gemini 等)
  - RULE-SET,ai_domain,AI
  - RULE-SET,ai_ip,AI,no-resolve

  # 7. 社交通讯平台 (Telegram / X 推特)
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,x_domain,推特

  # 8. 国际主流流媒体与流媒体 IP 规则
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,disney_domain,Disney+
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,netflix_ip,NETFLIX,no-resolve
  - RULE-SET,spotify_domain,Spotify

  # 9. 开发者与操作系统平台服务
  - RULE-SET,github_domain,GitHub
  - RULE-SET,bing_domain,Microsoft
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,google_domain,Google
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,apple_domain,Apple
  - RULE-SET,cloudflare_domain,CloudFlare
  - RULE-SET,cloudflare_ip,CloudFlare,no-resolve

  # 10. 全球数字游戏分发平台
  - RULE-SET,steam_domain,游戏平台
  - RULE-SET,rockstar_domain,游戏平台
  - RULE-SET,epicgames_domain,游戏平台
  - RULE-SET,ubisoft_domain,游戏平台

  # 11. GFW 被墙域名与国内平台直连
  - RULE-SET,gfw_domain,节点选择
  - RULE-SET,cn_domain,国内平台
  - RULE-SET,cn_ip,国内平台,no-resolve

  # 12. 终极漏网之鱼 (未命中任何上述规则时的全局兜底出站)
  - MATCH,漏网之鱼
