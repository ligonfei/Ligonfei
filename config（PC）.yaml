# ------------------------------------------------------------------------------
# 12. 路由分流规则 (Routing Rules)
# ------------------------------------------------------------------------------
rules:
  # ---------------- 0. PC 端进程级分流 (最高优先级) ----------------
  # 下载工具强制直连 (防止 BT/迅雷/网盘跑满代理流量或导致机场封号)
  - PROCESS-NAME,qbittorrent.exe,DIRECT
  - PROCESS-NAME,Transmission.exe,DIRECT
  - PROCESS-NAME,Thunder.exe,DIRECT
  - PROCESS-NAME,BaiduNetdisk.exe,DIRECT
  - PROCESS-NAME,IDMan.exe,DIRECT
  # 常用协同/会议工具强制直连 (低延迟)
  - PROCESS-NAME,WeChat.exe,DIRECT
  - PROCESS-NAME,TencentMeeting.exe,DIRECT
  - PROCESS-NAME,DingTalk.exe,DIRECT
  - PROCESS-NAME,AliyunDrive.exe,DIRECT
  # 常用代理软件桌面进程精准定向
  - PROCESS-NAME,Telegram.exe,Telegram

  # ---------------- 1. 私有网络与局域网直连 ----------------
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve

  # ---------------- 2. NTP 时间授时协议端口直连 ----------------
  - DST-PORT,123,DIRECT

  # ---------------- 3. 自定义域名专属出口 ----------------
  - DOMAIN-SUFFIX,ligon.top,Imm

  # ---------------- 4. 广告拦截与网络测速 ----------------
  - RULE-SET,adblock_domain,广告拦截
  - RULE-SET,speedtest_domain,Speedtest

  # ---------------- 5. 高安全性业务 ----------------
  - RULE-SET,password_manager_domain,密码管理器
  - RULE-SET,binance_domain,交易所
  - RULE-SET,OKX_domain,交易所
  - RULE-SET,bybit_domain,交易所
  - RULE-SET,gate_domain,交易所

  # ---------------- 6. 人工智能服务 ----------------
  - RULE-SET,ai_domain,AI
  - RULE-SET,ai_ip,AI,no-resolve

  # ---------------- 7. 社交通讯平台 ----------------
