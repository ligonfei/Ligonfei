# ------------------------------------------------------------------------------
# 11. 远程规则集提供商 (Rule Providers - MRS 二进制格式)
# ------------------------------------------------------------------------------
rule-providers:
  Fake-IP-Filter:
    <<: *domain
    path: ./rules/Fake-IP-Filter.mrs
    url: "https://github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/fakeip-filter.mrs"

  password_manager_domain:
    <<: *domain
    path: ./rules/password_manager.mrs
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-password-management.mrs"

